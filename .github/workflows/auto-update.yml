name: Automatisk Uppdatering och Arkivering

on:
  schedule:
    # Schemalagt två gånger i timmen vid minut 17 och 47 för att garantera tät uppdatering
    # och undvika att körningar hoppas över av GitHub Actions överbelastade köer vid hel- och halvtimmar.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: # Möjliggör manuell körning via GitHub-gränssnittet eller API

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-archive:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfigurera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Samla in källdata, expertanalyser och rotera arkiv
        run: |
          python3 scripts/fetch_sources.py
          python3 scripts/fetch_analyses.py
          python3 scripts/fetch_casualties.py

      - name: Validera datakvalitet och källkrav
        run: |
          python3 scripts/validate_data.py

      - name: Commit och pusha ändringar om data uppdaterats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Inga nya ändringar att spara."
          else
            git commit -m "Auto-update: Ny källdata och arkivrotation [skip ci]"
            git push || {
              echo "Push nekad på grund av samtidig körning. Synkar och försöker igen..."
              git pull --rebase -X theirs origin main || (git rebase --abort && git reset --soft origin/main)
              git push || echo "Data redan uppdaterad av en parallell körning."
            }
          fi

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ladda upp artefakter för Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Automatisk återhämtning vid tillfälligt Pages-fel (t.ex. 502 Bad Gateway)
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pages-publicering returnerade ett tillfälligt serverfel (status 502/nätverksfel)."
          echo "Väntar 15 sekunder och triggar en isolerad deploy via deploy.yml..."
          sleep 15
          gh workflow run deploy.yml --ref main || true


